<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <span class="name">TabFlip</span>
    <div class="shortcuts">
      <div class="shortcut-row">
        <span class="keys"><kbd>Ctrl</kbd> + <kbd>Q</kbd></span>
        <span class="label">open switcher</span>
      </div>
      <div class="shortcut-row">
        <span class="keys">hold <kbd>Ctrl</kbd>, press <kbd>Q</kbd></span>
        <span class="label">cycle tabs</span>
      </div>
      <div class="shortcut-row">
        <span class="keys">release <kbd>Ctrl</kbd></span>
        <span class="label">switch to tab</span>
      </div>
    </div>
    <p class="tip">Tip: Tab previews load after you visit each tab once.</p>
    <div class="divider"></div>
    <div class="setting-row">
      <label class="setting-label" for="maxTabs">Recent tabs shown</label>
      <select id="maxTabs" class="setting-select">
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="15">15</option>
        <option value="20">20</option>
        <option value="25">25</option>
      </select>
    </div>
    <div class="divider"></div>
    <a href="https://buymeacoffee.com/abidalista" target="_blank" class="coffee">☕ buy me a coffee</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
